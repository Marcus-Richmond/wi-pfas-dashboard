<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wisconsin PFAS Viewer</title>

    <!-- MapLibre -->
    <script src="https://unpkg.com/maplibre-gl@v5.14.0/dist/maplibre-gl.js"></script>
    <link 
      href="https://unpkg.com/maplibre-gl@v5.14.0/dist/maplibre-gl.css"
      rel="stylesheet"
    />

    <!-- stylesheets -->
    <link rel="stylesheet" href="./css/theme.css" />
    <link rel="stylesheet" href="./css/base.css" />
    <link rel="stylesheet" href="./css/layout.css" />
    <link rel="stylesheet" href="./css/components.css" />
    <link rel="stylesheet" href="./css/typography.css" />
    
    <!-- scripts -->
    <script type="module" src="./components/map.js"></script>
    <script type="module" src="./components/theme.js"></script>
    <script type="module" src="./components/sidebar/layer-list.js"></script>
</head>
<body>
    <div class="page">
        <div class="header panel panel-padded">
            <h1 class="header-title">Wisconsin PFAS Viewer</h1>
            <label for="theme-select">Theme</label>
            <select id="theme-select">
                <option value="dark" selected>Dark</option>
                <option value="light">Light</option>
                <option value="warm">Warm</option>
            </select>
        </div>
        <div class="sidebar panel panel-padded">
            <section>
                <h2 class="panel-title">Layers</h2>
                <ul class="layer-list" id="list1">
                    <li class="layer-row" id="locations">
                        <input type="checkbox" id="toggle-locations" checked>
                        <label for="toggle-locations">Sample Locations</label> 
                    </li>
                    <li class="layer-row" id="PFASsites">
                        <input type="checkbox" id="toggle-PFASsites" checked>
                        <label for="toggle-PFASsites">PFAS Sites</label> 
                    </li>
                </ul>
            </section>
        </div>
        <div class="map panel" id="map"></div>
        <div class="data panel panel-padded">
            <h2 class="panel-title">Data</h2>
        </div>
    </div>
</body>
</html>
